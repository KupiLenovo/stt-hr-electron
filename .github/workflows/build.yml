name: Build & Release

# PLT-22: tag v* pravi SAMO NACRT izdanja (draft). Nacrt ne vidi nijedna instalirana aplikacija (electron-updater čita samo
# objavljena izdanja). Objava je poseban posao `objavi` u GitHub okruženju `izdanje`, koje traži ručno odobrenje (Eldin).
# Do 4.7.0 je `publish-release` objavljivao odmah poslije builda — instalirane kase su ga vidjele bez ikakve provjere.
#
# Redoslijed: provjera taga + testovi → Windows i Mac gradnja + dimni test spakovane aplikacije (fajlovi ostaju u Actions, gradnje NE pišu
# na GitHub) → `nacrt`: JEDAN nacrt za tag sa svim fajlovima obje platforme + beta*.yml → (odobrenje) → `objavi`: provjeri spisak pa objavi.
# Do 4.8.0-beta.2 su gradnje same otpremale (`--publish always`): electron-builder je za isti tag napravio DVA nacrta, a objava je uzela
# onaj bez Mac fajlova (scripts/izdanje.js — zašto i kako).
# Tag vX.Y.Z-beta.N = probno izdanje: objavljuje se kao pre-release i vide ga samo računari na beta kanalu.
# test/izdanje.test.js drži da ovaj fajl ne objavljuje bez odobrenja i da izdanje ima sve fajlove.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: izdanje-${{ github.ref }}
  cancel-in-progress: false

jobs:
  provjera:
    runs-on: ubuntu-latest
    outputs:
      verzija: ${{ steps.tag.outputs.verzija }}
      beta: ${{ steps.tag.outputs.beta }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tag mora biti v<verzija iz package.json>
        id: tag
        run: node scripts/izdanje.js "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - name: Instaliraj prod ovisnosti (bez Electrona)
        run: npm ci --omit=dev
      - name: Testovi
        run: npm test

  build-windows:
    needs: provjera
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Fajl licenci trećih strana usklađen s package-lock.json
        run: node scripts/licence-trecih-strana.js --provjeri
      - name: Windows instalacija (bez otpremanja — nacrt puni posao nacrt)
        run: npm run build:win -- --publish never
      - name: Dimni test spakovane aplikacije (--smoke)
        run: node scripts/dimni-test.js dist/win-unpacked/aiERP.exe
      - name: Fajlovi za izdanje
        uses: actions/upload-artifact@v4
        with:
          name: izdanje-windows
          path: |
            dist/Vault-aiERP-Setup-*.exe
            dist/Vault-aiERP-Setup-*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 7

  build-mac:
    needs: provjera
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Fajl licenci trećih strana usklađen s package-lock.json
        run: node scripts/licence-trecih-strana.js --provjeri
      - name: macOS DMG (bez otpremanja — nacrt puni posao nacrt)
        run: npm run build:mac -- --publish never
      - name: Dimni test spakovane aplikacije (--smoke)
        run: node scripts/dimni-test.js dist/mac-arm64/aiERP.app/Contents/MacOS/aiERP
      - name: Fajlovi za izdanje
        uses: actions/upload-artifact@v4
        with:
          name: izdanje-mac
          path: |
            dist/Vault-aiERP-*.dmg
            dist/Vault-aiERP-*.dmg.blockmap
            dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 7

  nacrt:
    # JEDINI posao koji pravi nacrt i otprema fajlove: JEDAN nacrt za tag (napravi ga ili preuzme jedini postojeći nacrt tog taga;
    # više nacrta ili objavljeno izdanje za tag → pada). Nacrt ostaje nacrt — objavljuje samo `objavi`.
    needs: [provjera, build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # samo nacrt (draft: true) i njegovi fajlovi
    outputs:
      id: ${{ steps.nacrt.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Fajlovi obje gradnje
        uses: actions/download-artifact@v4
        with:
          pattern: izdanje-*
          merge-multiple: true
          path: izdanje
      - name: Fajlovi beta kanala (beta.yml, beta-mac.yml) + provjera spiska — ako nešto fali, ništa se ne otprema
        run: node scripts/izdanje.js --pripremi izdanje
      - name: Jedan nacrt za tag ← svi fajlovi
        id: nacrt
        uses: actions/github-script@v7
        env:
          VERZIJA: ${{ needs.provjera.outputs.verzija }}
        with:
          script: |
            const { napraviNacrt } = require('./scripts/izdanje.js');
            const id = await napraviNacrt({ github, repo: context.repo, tag: context.ref.replace('refs/tags/', ''),
              verzija: process.env.VERZIJA, sha: context.sha, dir: 'izdanje', log: core.info });
            core.setOutput('id', String(id));

  objavi:
    # JEDINI posao koji objavljuje. Okruženje `izdanje` (Settings → Environments) traži odobrenje — dok ga Eldin ne odobri,
    # izdanje ostaje nacrt. Bez okruženja s pravilom odobrenja ovaj posao bi išao sam: okruženje se podešava PRIJE prvog taga.
    # Prije objave: za tag postoji tačno ovaj jedan nacrt i ima SVE obavezne fajlove (scripts/izdanje.js obavezniFajlovi) — inače pada.
    needs: [provjera, build-windows, build-mac, nacrt]
    runs-on: ubuntu-latest
    environment: izdanje
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Provjeri nacrt pa objavi (beta → pre-release)
        uses: actions/github-script@v7
        env:
          VERZIJA: ${{ needs.provjera.outputs.verzija }}
          BETA: ${{ needs.provjera.outputs.beta }}
          NACRT: ${{ needs.nacrt.outputs.id }}
        with:
          script: |
            const { objaviNacrt } = require('./scripts/izdanje.js');
            await objaviNacrt({ github, repo: context.repo, tag: context.ref.replace('refs/tags/', ''),
              verzija: process.env.VERZIJA, beta: process.env.BETA === 'true', id: process.env.NACRT, log: core.info });
