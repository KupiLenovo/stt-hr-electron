name: Testovi

# Build & Release (build.yml) se pokreće SAMO na tag v*, pa testovi do sada nisu trčali ni na jednom pushu —
# čuvar koji nikad ne čuva. Ovdje se vrte na svakoj grani i svakom PR-u; ništa se ne gradi ni ne objavljuje.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # MAL-03: pos-kes testovi traže better-sqlite3 (prod dep). --omit=dev preskače Electron (dev dep) → CI ostaje lagan.
      # Node 20 ima prebuild za better-sqlite3; lokalno (Node 22+) testovi padnu na ugrađeni node:sqlite adapter, bez instalacije.
      - name: Instaliraj prod ovisnosti (better-sqlite3, bez Electrona)
        run: npm ci --omit=dev
      - name: Testovi (adresa servera, fiskalni tring/drajver, pos-kes, zabrana nešifrovane veze)
        run: npm test
