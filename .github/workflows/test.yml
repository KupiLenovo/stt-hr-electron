name: Testovi

# Build & Release (build.yml) se pokreće SAMO na tag v*, pa testovi do sada nisu trčali ni na jednom pushu —
# čuvar koji nikad ne čuva. Ovdje se vrte na svakoj grani i svakom PR-u; ništa se ne gradi ni ne objavljuje.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # 4.8.0-beta.2: baza kase je ugrađeni node:sqlite (lib/sqlite.js) — Node 22 (Electron ≥ 43 traži Node ≥ 22.12), bez nativnih modula.
      # --omit=dev preskače Electron i electron-builder (dev dep) → CI ostaje lagan.
      - name: Instaliraj prod ovisnosti (bez Electrona)
        run: npm ci --omit=dev
      - name: Testovi (adresa servera, fiskalni tring/drajver, pos-kes, zabrana nešifrovane veze)
        run: npm test
